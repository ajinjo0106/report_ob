<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉장OB 인원보고 시스템</title>
    <style>
        :root {
            --primary-color: #5f2d91;
            --bg-color: #f8f9fb;
            --border-color: #e1e4e8;
            --danger-color: #d93025;
        }

        body { font-family: 'Pretendard', sans-serif; padding: 20px; line-height: 1.6; background-color: var(--bg-color); color: #333; }
        .container { max-width: 480px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: var(--primary-color); margin-bottom: 25px; font-size: 1.5em; letter-spacing: -0.5px; }
        
        .section { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #f0f0f0; }
        .section:last-of-type { border-bottom: none; margin-bottom: 10px; }
        
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.85em; color: #444; }
        
        select, input, textarea { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); 
            border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: all 0.2s;
            background-color: #fff; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(95, 45, 145, 0.1); }

        .flex-row { display: flex; gap: 12px; margin-bottom: 15px; }
        .input-item { flex: 1; }
        
        .checkbox-container {
            border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; max-height: 140px; 
            overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fafafa;
        }
        .checkbox-item { display: flex; align-items: center; font-size: 13px; cursor: pointer; }
        .checkbox-item input { width: auto; margin-right: 8px; cursor: pointer; }
        
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #managerCount { color: var(--primary-color); font-weight: bold; font-size: 0.82em; background: rgba(95, 45, 145, 0.05); padding: 2px 8px; border-radius: 4px; }

        button { 
            width: 100%; padding: 14px; background-color: var(--primary-color); color: white; 
            border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; 
            margin-top: 10px; transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        
        #preview { 
            margin-top: 20px; padding: 15px; background: #333; color: #eee;
            white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; 
            border-radius: 6px; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>냉장OB 인원보고</h2>
    
    <div class="section">
        <div class="flex-row">
            <div class="input-item">
                <label style="color: var(--primary-color);">[ 채용사 ]</label>
                <select id="agency" onchange="onAgencyChange()">
                    <option value="K">K팀</option>
                    <option value="F">F팀</option>
                    <option value="R">R팀</option>
                    <option value="S">S팀</option>
                    <option value="P">P팀</option>
                </select>
            </div>
            <div class="input-item">
                <label style="color: var(--primary-color);">[ Shift ]</label>
                <select id="shift">
                    <option value="08시">08시</option>
                    <option value="10시">10시</option>
                    <option value="주간">주간</option>
                    <option value="풀타임">풀타임</option>
                    <option value="파트">파트</option>
                    <option value="21시">21시</option>
                </select>
            </div>
        </div>
    </div>

    <div class="section">
        <label style="color: var(--primary-color);">[ 보고자 ]</label>
        <select id="reporter">
            <option value="">채용사를 먼저 선택하세요</option>
        </select>
        <small style="color: #888;">* 선택한 채용사의 인원만 표시됩니다.</small>
    </div>

    <div class="section">
        <div class="label-row">
            <label style="color: var(--primary-color);">[ 인솔 담당 ]</label>
            <span id="managerCount">0명 선택됨</span>
        </div>
        <div id="managerCheckboxes" class="checkbox-container"></div>
    </div>

    <div class="section">
        <label style="margin-bottom: 12px; color: var(--primary-color);">[ T/O 및 출근 현황 ]</label>
        <div class="flex-row">
            <div class="input-item">
                <label>총 T/O</label>
                <input type="number" id="toTotal" placeholder="0">
            </div>
            <div class="input-item">
                <label>출근 인원</label>
                <input type="number" id="toActual" placeholder="0">
            </div>
        </div>
        <div class="flex-row" style="margin-top: 5px;">
            <div class="input-item">
                <label>기존</label>
                <input type="number" id="existing" placeholder="0">
            </div>
            <div class="input-item">
                <label>신규</label>
                <input type="number" id="newbie" placeholder="0">
            </div>
            <div class="input-item">
                <label>안전교육</label>
                <input type="number" id="safety" placeholder="0">
            </div>
        </div>
    </div>

    <div class="section">
        <label style="margin-bottom: 12px; color: var(--primary-color);">[ 계약서 ]</label>
        <div class="flex-row">
            <div class="input-item">
                <label>컬리로</label>
                <input type="number" id="kurlyRo" placeholder="0">
            </div>
            <div class="input-item">
                <label>수기 작성</label>
                <input type="number" id="manual" placeholder="0">
            </div>
        </div>
    </div>

    <div class="section">
        <label style="color: var(--danger-color);">[ 특이사항 ]</label>
        <textarea id="remarks" rows="2" placeholder="특이사항이 있으면 기입 부탁드립니다."></textarea>
    </div>

    <button onclick="generateReport()">보고 양식 생성</button>
    <div id="preview">보고 양식이 여기에 표시됩니다.</div>
    <button onclick="sendToSlack()" style="background-color: #2eb67d;">슬랙으로 전송하기</button>
</div>

<script>
    const teamData = {
        "K": [{ name: "권도영", id: "U07744G67NJ" }, { name: "김영찬", id: "U06A3JZ05MH" }, { name: "박진호", id: "U09TQE5L7ED" }, { name: "신아영", id: "U06EDJEBWE5" }, { name: "이준형", id: "U09SW3V920P" }, { name: "전범우", id: "U076M23RTQT" }, { name: "최세희", id: "U09SW3U6Q3H" }, { name: "홍재현", id: "U09EZF7C6AH" }],
        "F": [{ name: "김슬기", id: "U091Q23BZHV" }, { name: "이기형", id: "U06DWBUPDKL" }, { name: "이현서", id: "U09M62DLTC4" }, { name: "전태희", id: "U08EM4TC2SY" }, { name: "정민진", id: "U06AMU8EN92" }],
        "R": [{ name: "박민정", id: "U08N7UNFAHW" }, { name: "박준우", id: "U08K5K2QTL0" }, { name: "배정국", id: "U07PLQ8C4V6" }, { name: "윤영미", id: "U07C83MLUU8" }, { name: "윤희선", id: "U09MDUH6831" }, { name: "이시원", id: "U06KWN6A212" }],
        "S": [{ name: "곽예슬", id: "U08N5KH00HY" }, { name: "신대성", id: "U099L8CCP71" }, { name: "임현욱", id: "U08845DSL0Z" }],
        "P": [{ name: "백진주", id: "U092XRH76UD" }, { name: "이수현", id: "U096X5Y4L9J" }, { name: "이현준", id: "U092SL19BD0" }, { name: "전영제", id: "U08LYN8EHF1" }]
    };

    const shiftTimes = {
        "08시": "08:00 ~ 17:00", "10시": "10:00 ~ 19:00", "주간": "08:00 ~ 17:00",
        "풀타임": "16:00 ~ 00:50", "파트": "19:00 ~ 00:50", "21시": "21:00 ~ 06:00"
    };

    // [추가] 각 시프트별 보고 허용 시간대 (24시간제)
    // start: 시작 시간, end: 종료 시간
    const shiftReportTimes = {
        "08시": { start: 7, end: 9 },      // 07시~09시 사이 보고 권장
        "10시": { start: 9, end: 11 },     // 09시~11시 사이 보고 권장
        "주간": { start: 7, end: 10 },     // 13시~14시 사이 보고 권장
        "풀타임": { start: 15, end: 17 },  // 15시~17시 사이 보고 권장
        "파트": { start: 18, end: 20 },    // 19시~20시 사이 보고 권장
        "21시": { start: 20, end: 22 }     // 20시~22시 사이 보고 권장
    };

    window.onload = onAgencyChange;

    function onAgencyChange() {
        updateReporters();
        updateManagers();
    }

    function updateReporters() {
        const agency = document.getElementById('agency').value;
        const reporterSelect = document.getElementById('reporter');
        reporterSelect.innerHTML = '<option value="">보고자를 선택하세요</option>';
        teamData[agency].forEach(person => {
            const opt = document.createElement('option');
            opt.value = person.id;
            opt.innerHTML = person.name;
            reporterSelect.appendChild(opt);
        });
    }

    function updateManagers() {
        const agency = document.getElementById('agency').value;
        const container = document.getElementById('managerCheckboxes');
        container.innerHTML = "";
        teamData[agency].forEach(person => {
            const div = document.createElement('div');
            div.className = 'checkbox-item';
            div.innerHTML = `<label style="font-weight:normal; margin-bottom:0; cursor:pointer;"><input type="checkbox" name="mgr" value="${person.name}" onchange="countSelectedManagers()"> ${person.name}</label>`;
            container.appendChild(div);
        });
        countSelectedManagers();
    }

    function countSelectedManagers() {
        const selected = document.querySelectorAll('input[name="mgr"]:checked').length;
        document.getElementById('managerCount').innerText = `${selected}명 선택됨`;
    }

   function generateReport() {
        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        
        const agency = document.getElementById('agency').value;
        const shift = document.getElementById('shift').value;

        // 1. [방어 로직] 시간 범위 체크
        const timeRange = shiftReportTimes[shift];
        if (currentHour < timeRange.start || currentHour >= timeRange.end) {
            alert(`⚠️ Shift 확인 필요\n\n현재 시간은 ${currentHour}시 ${currentMinute}분입니다.\n선택하신 Shift [ ${shift} ] 보고 시간대가 아닙니다.\n\n선택하신 Shift 확인 부탁드립니다.`);
        }

        // 입력 값 가져오기 (숫자로 변환)
        const vals = {
            toTotal: parseInt(document.getElementById('toTotal').value) || 0,
            toActual: parseInt(document.getElementById('toActual').value) || 0,
            existing: parseInt(document.getElementById('existing').value) || 0,
            newbie: parseInt(document.getElementById('newbie').value) || 0,
            safety: parseInt(document.getElementById('safety').value) || 0,
            kurlyRo: parseInt(document.getElementById('kurlyRo').value) || 0,
            manual: parseInt(document.getElementById('manual').value) || 0
        };

        // 2. [방어 로직] 인원 합계 일치 여부 체크 (추가됨)
        const sumActual = vals.existing + vals.newbie + vals.safety;
        if (vals.toActual !== sumActual) {
            alert(`⚠️ 인원 불일치\n\n입력하신 출근인원(${vals.toActual}명)과\n 총원(${sumActual}명: 기존${vals.existing}+신규${vals.newbie}+안전${vals.safety})이 일치하지 않습니다.\n\n출근인원과 기존/신규/안전교육 인원 확인부탁드립니다.`);
        }

        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const selected = Array.from(document.querySelectorAll('input[name="mgr"]:checked'));
        const mgrs = selected.map(el => el.value).join(', ');
        
        const reporterSelect = document.getElementById('reporter');
        const reporterId = reporterSelect.value;
        const mention = reporterId ? `<@${reporterId}> : ${agency}팀 인원 보고드립니다.\n` : "";

        const remarksValue = document.getElementById('remarks').value.trim();
        const remarksHeader = remarksValue ? `** ${remarksValue} **\n` : "";

        const report = `${mention}${remarksHeader}--------------------------------------------------
컬리 ${agency}팀 ${mm}월 ${dd}일

냉장OB ${shift} 인원 보고
( ${shiftTimes[shift]} )

인솔 담당 - ${mgrs || "(없음)"} (총 ${selected.length}명)
총 T/O : ${vals.toTotal} / ${vals.toActual}
(기존 ${vals.existing}, 신규 ${vals.newbie}, 안전교육 ${vals.safety})
 
계약서
컬리로 : ${vals.kurlyRo}명 / 수기작성 : ${vals.manual}명
--------------------------------------------------`;

        document.getElementById('preview').innerText = report;
        return report;
    }

          function sendToSlack() {
        const text = document.getElementById('preview').innerText;
        if (text.includes("여기에 표시됩니다")) {
            alert("먼저 [보고 양식 생성] 버튼을 눌러주세요.");
            return;
        }
        const slackUrl = "YOUR_SLACK_WEBHOOK_URL_HERE"; 
        if(slackUrl.includes("YOUR_SLACK")) { alert("웹훅 URL을 설정해주세요."); return; }
        fetch(slackUrl, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ text: text }) })
        .then(() => alert("슬랙 전송 요청을 보냈습니다!"))
        .catch(err => alert("에러: " + err));
    }
</script>

</body>
</html>
